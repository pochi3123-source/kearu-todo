<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1E57C8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>pochi</title>
  <style>
    :root {
      --xp-sky-top: #1E57C8;
      --xp-sky-mid: #3B82F6;
      --xp-sky-low: #84CAFF;
      --xp-sky-horizon: #CAE8FF;
      --card-glass: rgba(255, 255, 255, 0.93);
      --card-glass-done: rgba(255, 255, 255, 0.78);
      --text-main: #0F172A;
      --text-sub: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #1E57C8;
    }

    .bliss-screen {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: linear-gradient(
        180deg,
        var(--xp-sky-top) 0%,
        var(--xp-sky-mid) 38%,
        var(--xp-sky-low) 67%,
        var(--xp-sky-horizon) 82%
      );
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .bliss-svg-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .screen-foreground {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 14px 14px;
      overflow: hidden;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .app-header h1 {
      color: #FFFFFF;
      font-size: 21px;
      font-weight: 800;
      text-shadow: 0 1px 4px rgba(15, 35, 80, 0.35);
    }

    .app-header p {
      color: #EFF6FF;
      font-size: 11.5px;
      margin-top: 2px;
    }

    .sync-pill {
      background: rgba(255, 255, 255, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .tabs-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 10px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700;
      padding: 9px 4px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.95);
      color: #1E40AF;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.12);
    }

    .app-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 12px;
    }


    .drag-handle {
      color: #64748B;
      font-size: 19px;
      line-height: 1;
      padding: 8px 6px 8px 2px;
      margin: -4px 0 -4px -2px;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.15s ease, background 0.15s ease;
    }
    .drag-handle:active {
      cursor: grabbing;
      color: #1D4ED8;
      background: rgba(59, 130, 246, 0.12);
    }
    .todo-card {
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }
    .todo-card.drag-placeholder {
      opacity: 0.28;
      background: rgba(255, 255, 255, 0.45);
      border: 2px dashed rgba(37, 99, 235, 0.65);
      box-shadow: inset 0 2px 8px rgba(15, 23, 42, 0.08);
      transform: scale(0.98);
    }
    .todo-card.drag-floating {
      position: fixed;
      margin: 0;
      pointer-events: none;
      z-index: 9999;
      background: rgba(255, 255, 255, 0.98);
      border: 2px solid #3B82F6;
      box-shadow:
        0 20px 38px rgba(15, 23, 42, 0.32),
        0 6px 14px rgba(37, 99, 235, 0.22);
      transition: box-shadow 0.15s ease;
    }
    .todo-card.drag-floating .drag-handle {
      color: #2563EB;
      background: rgba(59, 130, 246, 0.14);
    }

    .todo-card {
      background: var(--card-glass);
      border: 1px solid #FFFFFF;
      border-radius: 16px;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
    }

    .todo-card.done-card {
      background: var(--card-glass-done);
    }

    .checkbox-btn {
      width: 26px;
      height: 26px;
      min-width: 26px;
      border-radius: 8px;
      border: 2.2px solid #2563EB;
      background: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
    }

    .checkbox-btn.checked {
      background: #4D9E14;
      border-color: #4D9E14;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    .done-card .card-title {
      text-decoration: line-through;
      color: #475569;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }

    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .badge-submit { background: #FEE2E2; color: #B91C1C; }
    .badge-due { background: #DBEAFE; color: #1D4ED8; }
    .badge-kearu { background: #DCFCE7; color: #15803D; }

    .card-note {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .move-btn {
      background: #F1F5F9;
      border: none;
      color: #475569;
      font-size: 11px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
    }

    .move-btn.promote {
      background: #DBEAFE;
      color: #1D4ED8;
    }

    .empty-box {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 22px 14px;
      text-align: center;
    }

    .empty-box h4 {
      font-size: 15px;
      color: #1E3A8A;
      margin-bottom: 6px;
    }

    .empty-box p {
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
    }

    .quick-add-box {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #FFFFFF;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }

    .quick-options {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .quick-options.open { display: flex; }

    .quick-options input {
      width: 100%;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .quick-options-row { display: flex; gap: 6px; }

    .submit-toggle-btn {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      color: #475569;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .submit-toggle-btn.active {
      background: #FEE2E2;
      border-color: #FCA5A5;
      color: #B91C1C;
    }

    .quick-main-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .opt-toggle-btn {
      background: #E0F2FE;
      color: #0369A1;
      border: none;
      border-radius: 10px;
      padding: 10px 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .quick-input {
      flex: 1;
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 14px;
    }

    .quick-submit-btn {
      background: #4D9E14;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .settings-sheet {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .settings-sheet.open { display: flex; }

    .settings-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 18px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-card h3 { font-size: 15px; color: #1E3A8A; }
    .settings-card input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #CBD5E1;
      font-size: 13px;
    }
    .settings-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-primary {
      background: #2563EB;
      color: #FFF;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary {
      background: #E2E8F0;
      color: #334155;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Chat / Remote Instruction Tab Styles */
    .chat-pair {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 4px;
    }
    .chat-user-row {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 6px;
    }
    .chat-user-bubble {
      max-width: 84%;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      border-radius: 16px 16px 4px 16px;
      padding: 10px 13px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 3px 10px rgba(29, 78, 216, 0.25);
    }
    .chat-meta {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 4px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    .chat-del-btn {
      background: rgba(255, 255, 255, 0.18);
      border: none;
      color: #FFFFFF;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .chat-ai-row {
      display: flex;
      justify-content: flex-start;
    }
    .chat-ai-bubble {
      max-width: 90%;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #FFFFFF;
      color: var(--text-main);
      border-radius: 16px 16px 16px 4px;
      padding: 11px 13px;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
    }
    .chat-ai-header {
      font-size: 11px;
      font-weight: 800;
      color: #1D4ED8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .chat-ai-bubble.pending {
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px dashed #60A5FA;
    }
    .chat-presets-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .chat-presets-row::-webkit-scrollbar { display: none; }
    .chat-chip {
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      color: #1D4ED8;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 999px;
      white-space: nowrap;
      cursor: pointer;
    }
    .chat-input-area {
      flex: 1;
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
      resize: none;
      min-height: 40px;
      max-height: 96px;
      line-height: 1.35;
    }
    .chat-send-btn {
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="bliss-screen">
    <svg class="bliss-svg-bg" viewBox="0 0 400 800" preserveAspectRatio="none">
      <ellipse cx="90" cy="150" rx="75" ry="22" fill="rgba(255,255,255,0.42)" />
      <ellipse cx="130" cy="142" rx="55" ry="26" fill="rgba(255,255,255,0.52)" />
      <ellipse cx="310" cy="210" rx="85" ry="24" fill="rgba(255,255,255,0.38)" />
      <ellipse cx="200" cy="430" rx="130" ry="28" fill="rgba(255,255,255,0.55)" />
      <path d="M0,535 C120,480 260,510 400,550 L400,800 L0,800 Z" fill="#7CC623" />
      <path d="M0,585 C150,550 280,530 400,575 L400,800 L0,800 Z" fill="#56A818" />
      <path d="M0,645 C140,615 290,635 400,615 L400,800 L0,800 Z" fill="#3B8712" />
    </svg>

    <div class="screen-foreground">
      <div class="app-header">
        <div>
          <h1>☁️ pochi</h1>
          <p>スピードではなくベクトル。今日触れる1〜3個だけ</p>
        </div>
        <button class="sync-pill" id="syncPillBtn" onclick="openSettings()">🌿 設定</button>
      </div>

      <div class="tabs-bar">
        <button class="tab-btn active" id="tabBtn-today" onclick="switchTab('today')">☀️ 今日</button>
        <button class="tab-btn" id="tabBtn-backlog" onclick="switchTab('backlog')">🌱 控え</button>
        <button class="tab-btn" id="tabBtn-done" onclick="switchTab('done')">✨ 軌跡</button>
        <button class="tab-btn" id="tabBtn-chat" onclick="switchTab('chat')">💬 指示</button>
      </div>

      <div class="app-list" id="appListContainer"></div>

      <div class="quick-add-box" id="todoQuickAddBox">
        <div class="quick-options" id="quickOptionsPanel">
          <input type="text" id="noteInput" placeholder="1行補足（例: 最小: 1問だけ見る）" />
          <div class="quick-options-row">
            <input type="date" id="dueInput" />
            <button type="button" class="submit-toggle-btn" id="submitToggleBtn" onclick="toggleSubmitFlag()">
              ＋提出確認まで
            </button>
          </div>
        </div>
        <div class="quick-main-row">
          <button type="button" class="opt-toggle-btn" onclick="toggleQuickOptions()">1行補足</button>
          <input
            type="text"
            class="quick-input"
            id="titleInput"
            placeholder="今日触れることに1秒で追加..."
            onkeydown="if(event.key==='Enter') handleAddTodo()"
          />
          <button type="button" class="quick-submit-btn" onclick="handleAddTodo()">追加</button>
        </div>
      </div>

      <div class="quick-add-box" id="chatQuickAddBox" style="display:none;">
        <div class="chat-presets-row">
          <button type="button" class="chat-chip" onclick="insertChatPreset('【日記】')">📝 日記・思考</button>
          <button type="button" class="chat-chip" onclick="insertChatPreset('【調べて】')">🔍 調べ物・Wiki化</button>
          <button type="button" class="chat-chip" onclick="insertChatPreset('【作業】')">🛠️ コード・作業指示</button>
          <button type="button" class="chat-chip" onclick="insertChatPreset('【TODO整理】')">☀️ TODO整理</button>
        </div>
        <div class="quick-main-row">
          <textarea
            class="chat-input-area"
            id="chatInput"
            rows="1"
            placeholder="Macの俺へ指示・相談・日記を送る..."
            onkeydown="if(event.key==='Enter' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); handleSendChat(); }"
          ></textarea>
          <button type="button" class="chat-send-btn" id="chatSendBtn" onclick="handleSendChat()">送信</button>
        </div>
      </div>
    </div>

    <div class="settings-sheet" id="settingsSheet">
      <div class="settings-card">
        <h3>📲 ホーム画面ウィジェット対応版 (Android APK)</h3>
        <a href="./pochi.apk" download="pochi.apk" style="display:block;text-align:center;background:#4D9E14;color:#FFF;text-decoration:none;padding:11px;border-radius:10px;font-weight:800;font-size:13.5px;margin-bottom:6px;">📦 pochi.apk（ウィジェット付き）をダウンロード</a>
        <h3 style="margin-top:6px;">🔗 Supabase リアルタイム同期設定</h3>
        <input type="text" id="sbUrlInput" placeholder="Supabase URL (https://xxxx.supabase.co)" />
        <input type="password" id="sbKeyInput" placeholder="Supabase anon public key" />
        <div class="settings-actions">
          <button class="btn-secondary" onclick="closeSettings()">閉じる</button>
          <button class="btn-primary" onclick="saveSettings()">保存して同期</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'kearu_todo_preview_items_v1';
    const SB_URL_KEY = 'kearu_todo_sb_url';
    const SB_ANON_KEY = 'kearu_todo_sb_anon_key';

    const DEFAULT_ITEMS = [
      {
        id: 'kearu-1',
        title: '出社する竹内さんへ一言話しかける',
        short_note: '最小: うまく話そうとせず挨拶＋一言だけ',
        requires_submission_check: false,
        is_today: true,
        due_date: '2026-11-05',
        status: 'todo',
        source: 'kearu',
        completed_at: null,
        created_at: '2026-11-04T23:00:00+09:00'
      },
      {
        id: 'kearu-2',
        title: '紙ノートを開いて1行だけ字を書く',
        short_note: '最小: 風呂上がりにペンを持つだけ',
        requires_submission_check: false,
        is_today: true,
        due_date: null,
        status: 'todo',
        source: 'kearu',
        completed_at: null,
        created_at: '2026-11-04T23:05:00+09:00'
      },
      {
        id: 'kearu-3',
        title: 'Logicを開いてボーカルC案を10秒聴く',
        short_note: '最小: プロジェクトを開くだけでクリア',
        requires_submission_check: false,
        is_today: true,
        due_date: null,
        status: 'todo',
        source: 'kearu',
        completed_at: null,
        created_at: '2026-11-04T23:10:00+09:00'
      },
      {
        id: 'kearu-4',
        title: 'Windows PCの定期通知タスクを停止する',
        short_note: '設定画面で無効化・停止反映の確認まで',
        requires_submission_check: true,
        is_today: false,
        due_date: null,
        status: 'todo',
        source: 'kearu',
        completed_at: null,
        created_at: '2026-11-04T23:15:00+09:00'
      },
      {
        id: 'kearu-5',
        title: '応用情報・DFSの図解ページを1つ眺める',
        short_note: '最小: Wikiの図を1個見るだけ',
        requires_submission_check: false,
        is_today: false,
        due_date: null,
        status: 'todo',
        source: 'kearu',
        completed_at: null,
        created_at: '2026-11-04T23:20:00+09:00'
      }
    ];

    let currentTab = 'today';
    let quickSubmitFlag = false;
    let items = [];

    function getCreds() {
      const params = new URLSearchParams(location.search);
      if (params.get('sb_url') && params.get('sb_key')) {
        localStorage.setItem(SB_URL_KEY, params.get('sb_url'));
        localStorage.setItem(SB_ANON_KEY, params.get('sb_key'));
      }
      return {
        url: localStorage.getItem(SB_URL_KEY) || 'https://qwvcxsifvqvoexqswdno.supabase.co',
        key: localStorage.getItem(SB_ANON_KEY) || 'sb_publishable_B5dePwA6PSq53X1tFhMS5w_CQAC0Kh8'
      };
    }

    async function loadItems() {
      const { url, key } = getCreds();
      const pill = document.getElementById('syncPillBtn');
      if (url && key) {
        pill.textContent = '🟢 同期中';
        try {
          const res = await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos?select=*&order=created_at.asc`, {
            headers: { apikey: key, Authorization: `Bearer ${key}` }
          });
          if (res.ok) {
            items = await res.json();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            renderAll();
            return;
          }
        } catch (e) {}
      } else {
        pill.textContent = '🌿 設定';
      }
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      renderAll();
    }

    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      renderAll();
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function isChatItem(t) {
      return String(t && t.title || '').startsWith('[CHAT]');
    }

    function formatTimeShort(isoStr) {
      if (!isoStr) return '';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return '';
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${mm}/${dd} ${hh}:${mi}`;
      } catch (e) {
        return '';
      }
    }

    function renderAll(scrollChatToBottom = false) {
      const todoItems = items.filter(t => !isChatItem(t));
      const chatList = items
        .filter(t => isChatItem(t))
        .sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));

      const todayList = todoItems.filter(t => t.status === 'todo' && (t.is_today || Boolean(t.due_date)));
      const todayIds = new Set(todayList.map(t => t.id));
      const backlogList = todoItems.filter(t => t.status === 'todo' && !todayIds.has(t.id));
      const doneList = todoItems.filter(t => t.status === 'done');

      document.getElementById('tabBtn-today').textContent = `☀️ 今日 (${todayList.length})`;
      document.getElementById('tabBtn-backlog').textContent = `🌱 控え (${backlogList.length})`;
      document.getElementById('tabBtn-done').textContent = `✨ 軌跡 (${doneList.length})`;
      const pendingCount = chatList.filter(c => !c.short_note || c.short_note.startsWith('⏳')).length;
      document.getElementById('tabBtn-chat').textContent = pendingCount > 0 ? `💬 指示 (${pendingCount})` : `💬 指示`;

      const todoBox = document.getElementById('todoQuickAddBox');
      const chatBox = document.getElementById('chatQuickAddBox');
      if (todoBox && chatBox) {
        todoBox.style.display = currentTab === 'chat' ? 'none' : 'block';
        chatBox.style.display = currentTab === 'chat' ? 'block' : 'none';
      }

      const el = document.getElementById('appListContainer');

      if (currentTab === 'chat') {
        if (!chatList.length) {
          el.innerHTML = `<div class="empty-box"><h4>💬 Macの俺へ指示を出せます</h4><p>下の入力欄から「〇〇調べてWikiにまとめて」「今日の日記：〜」など何でも送ってください。Mac側のAntigravityが自動で受け取って返事をここに返します。</p></div>`;
          return;
        }
        el.innerHTML = chatList.map(item => {
          const userMsg = String(item.title || '').replace(/^\[CHAT\]\s*/, '');
          const reply = String(item.short_note || '').trim();
          const timeStr = formatTimeShort(item.created_at);
          let aiBubbleHtml = '';
          if (!reply) {
            aiBubbleHtml = `
              <div class="chat-ai-row">
                <div class="chat-ai-bubble pending">⏳ Macへ送信済み（受領待ち...）</div>
              </div>
            `;
          } else if (reply.startsWith('⏳')) {
            aiBubbleHtml = `
              <div class="chat-ai-row">
                <div class="chat-ai-bubble pending">🟢 ${escapeHtml(reply)}</div>
              </div>
            `;
          } else {
            aiBubbleHtml = `
              <div class="chat-ai-row">
                <div class="chat-ai-bubble">
                  <div class="chat-ai-header">🤖 俺（Mac / Antigravity）</div>
                  <div>${escapeHtml(reply)}</div>
                </div>
              </div>
            `;
          }
          return `
            <div class="chat-pair" data-id="${item.id}">
              <div class="chat-user-row">
                <div class="chat-user-bubble">
                  <div>${escapeHtml(userMsg)}</div>
                  <div class="chat-meta">
                    <span>${escapeHtml(timeStr)}</span>
                    <button class="chat-del-btn" onclick="deleteChatItem('${item.id}')" title="削除">削除</button>
                  </div>
                </div>
              </div>
              ${aiBubbleHtml}
            </div>
          `;
        }).join('');
        if (scrollChatToBottom) {
          requestAnimationFrame(() => {
            el.scrollTop = el.scrollHeight;
          });
        }
        return;
      }

      const list = currentTab === 'today' ? todayList : currentTab === 'backlog' ? backlogList : doneList;

      if (!list.length) {
        el.innerHTML = `<div class="empty-box"><h4>🌿 項目はありません</h4><p>青空と草原を眺めてゆっくり過ごそう</p></div>`;
        return;
      }

      el.innerHTML = list.map(item => {
        const isDone = item.status === 'done';
        const badges = [];
        if (item.requires_submission_check) badges.push(`<span class="badge badge-submit">提出・反映確認まで</span>`);
        if (item.due_date) badges.push(`<span class="badge badge-due">📅 期限 ${escapeHtml(item.due_date)}</span>`);
        if (item.source === 'kearu') badges.push(`<span class="badge badge-kearu">ケアル対話</span>`);

        const moveBtn = currentTab === 'today'
          ? `<button class="move-btn" onclick="moveItem('${item.id}', false)">控えへ</button>`
          : currentTab === 'backlog'
          ? `<button class="move-btn promote" onclick="moveItem('${item.id}', true)">☀️ 今日へ</button>`
          : '';

        const dragHandle = !isDone
          ? `<div class="drag-handle" data-drag-handle="1" title="ドラッグして順番入れ替え">≡</div>`
          : '';
        return `
          <div class="todo-card ${isDone ? 'done-card' : ''}" data-id="${item.id}">
            ${dragHandle}
            <button class="checkbox-btn ${isDone ? 'checked' : ''}" onclick="${isDone ? `reopenItem('${item.id}')` : `completeItem('${item.id}')`}">${isDone ? '✓' : ''}</button>
            <div class="card-body">
              <div class="card-title">${escapeHtml(item.title)}</div>
              ${badges.length ? `<div class="card-badges">${badges.join('')}</div>` : ''}
              ${item.short_note ? `<div class="card-note">${escapeHtml(item.short_note)}</div>` : ''}
            </div>
            ${moveBtn}
          </div>
        `;
      }).join('');
    }

    function notifyNativeWidget() {
      try {
        if (window.PochiBridge && typeof window.PochiBridge.refreshWidget === 'function') {
          window.PochiBridge.refreshWidget();
        }
      } catch (e) {}
    }

    async function completeItem(id) {
      const nowIso = new Date().toISOString();
      items = items.map(t => t.id === id ? { ...t, status: 'done', completed_at: nowIso } : t);
      saveItems();
      const { url, key } = getCreds();
      if (url && key) {
        await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos?id=eq.${encodeURIComponent(id)}`, {
          method: 'PATCH',
          headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'done', completed_at: nowIso })
        });
        notifyNativeWidget();
      }
    }

    async function reopenItem(id) {
      items = items.map(t => t.id === id ? { ...t, status: 'todo', completed_at: null } : t);
      saveItems();
      const { url, key } = getCreds();
      if (url && key) {
        await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos?id=eq.${encodeURIComponent(id)}`, {
          method: 'PATCH',
          headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'todo', completed_at: null })
        });
        notifyNativeWidget();
      }
    }

    async function moveItem(id, toToday) {
      items = items.map(t => t.id === id ? { ...t, is_today: toToday } : t);
      saveItems();
      const { url, key } = getCreds();
      if (url && key) {
        await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos?id=eq.${encodeURIComponent(id)}`, {
          method: 'PATCH',
          headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_today: toToday })
        });
        notifyNativeWidget();
      }
    }

    async function handleAddTodo() {
      const titleEl = document.getElementById('titleInput');
      const noteEl = document.getElementById('noteInput');
      const dueEl = document.getElementById('dueInput');
      const title = titleEl.value.trim();
      if (!title) return;

      const newItem = {
        id: 'local-' + Date.now(),
        title,
        short_note: noteEl.value.trim(),
        requires_submission_check: quickSubmitFlag,
        is_today: currentTab !== 'backlog',
        due_date: dueEl.value || null,
        status: 'todo',
        source: 'android',
        completed_at: null,
        created_at: new Date().toISOString()
      };

      titleEl.value = '';
      noteEl.value = '';
      dueEl.value = '';
      quickSubmitFlag = false;
      document.getElementById('submitToggleBtn').classList.remove('active');
      document.getElementById('quickOptionsPanel').classList.remove('open');

      const { url, key } = getCreds();
      if (url && key) {
        const { id, ...payload } = newItem;
        await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos`, {
          method: 'POST',
          headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        await loadItems();
        notifyNativeWidget();
        return;
      }

      items.unshift(newItem);
      saveItems();
    }

    function insertChatPreset(prefix) {
      const input = document.getElementById('chatInput');
      if (!input) return;
      if (!input.value.startsWith(prefix)) {
        input.value = prefix + ' ' + input.value;
      }
      input.focus();
    }

    async function handleSendChat() {
      const input = document.getElementById('chatInput');
      const btn = document.getElementById('chatSendBtn');
      const text = (input.value || '').trim();
      if (!text) return;

      input.value = '';
      if (btn) btn.disabled = true;

      const newItem = {
        id: 'local-chat-' + Date.now(),
        title: '[CHAT] ' + text,
        short_note: '',
        requires_submission_check: false,
        is_today: false,
        due_date: null,
        status: 'done',
        source: 'android',
        completed_at: new Date().toISOString(),
        created_at: new Date().toISOString()
      };

      const { url, key } = getCreds();
      if (url && key) {
        try {
          const { id, ...payload } = newItem;
          await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos`, {
            method: 'POST',
            headers: { apikey: key, Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          await loadItems();
          renderAll(true);
        } catch (e) {
          items.push(newItem);
          saveItems();
          renderAll(true);
        } finally {
          if (btn) btn.disabled = false;
        }
        return;
      }

      items.push(newItem);
      saveItems();
      renderAll(true);
      if (btn) btn.disabled = false;
    }

    async function deleteChatItem(id) {
      items = items.filter(t => t.id !== id);
      saveItems();
      const { url, key } = getCreds();
      if (url && key && !String(id).startsWith('local-')) {
        await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos?id=eq.${encodeURIComponent(id)}`, {
          method: 'DELETE',
          headers: { apikey: key, Authorization: `Bearer ${key}` }
        }).catch(() => {});
      }
    }

    async function pollChatUpdates() {
      if (dragState) return;
      const { url, key } = getCreds();
      if (!url || !key) return;
      try {
        const res = await fetch(`${url.replace(/\/$/, '')}/rest/v1/todos?select=*&order=created_at.asc`, {
          headers: { apikey: key, Authorization: `Bearer ${key}` }
        });
        if (!res.ok) return;
        const fresh = await res.json();
        const oldSig = JSON.stringify(items);
        const newSig = JSON.stringify(fresh);
        if (oldSig !== newSig) {
          items = fresh;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
          renderAll(currentTab === 'chat');
        }
      } catch (e) {}
    }

    function switchTab(tab) {
      currentTab = tab;
      ['today', 'backlog', 'done', 'chat'].forEach(t => {
        const btn = document.getElementById('tabBtn-' + t);
        if (btn) btn.classList.toggle('active', t === tab);
      });
      renderAll(tab === 'chat');
    }

    function toggleQuickOptions() {
      document.getElementById('quickOptionsPanel').classList.toggle('open');
    }

    function toggleSubmitFlag() {
      quickSubmitFlag = !quickSubmitFlag;
      document.getElementById('submitToggleBtn').classList.toggle('active', quickSubmitFlag);
    }

    function openSettings() {
      const { url, key } = getCreds();
      document.getElementById('sbUrlInput').value = url;
      document.getElementById('sbKeyInput').value = key;
      document.getElementById('settingsSheet').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsSheet').classList.remove('open');
    }

    function saveSettings() {
      localStorage.setItem(SB_URL_KEY, document.getElementById('sbUrlInput').value.trim());
      localStorage.setItem(SB_ANON_KEY, document.getElementById('sbKeyInput').value.trim());
      closeSettings();
      loadItems();
    }

    let dragState = null;

    function initDragReorder() {
      const container = document.getElementById("appListContainer");
      if (!container || container.dataset.dragInit === "1") return;
      container.dataset.dragInit = "1";

      container.addEventListener("pointerdown", (e) => {
        const handle = e.target.closest("[data-drag-handle]");
        if (!handle || currentTab === "done" || dragState) return;
        const card = handle.closest(".todo-card");
        if (!card) return;

        e.preventDefault();
        try {
          card.setPointerCapture(e.pointerId);
        } catch (_) {}

        if (navigator.vibrate) {
          try { navigator.vibrate(12); } catch (_) {}
        }

        const rect = card.getBoundingClientRect();
        const floating = card.cloneNode(true);
        floating.classList.add("drag-floating");
        floating.style.width = `${rect.width}px`;
        floating.style.height = `${rect.height}px`;
        floating.style.left = `${rect.left}px`;
        floating.style.top = `${rect.top}px`;
        floating.style.transform = "translate3d(0px, 0px, 0) scale(1) rotate(0deg)";
        floating.style.transition = "transform 130ms cubic-bezier(0.2, 0.9, 0.3, 1.25), box-shadow 130ms ease";
        document.body.appendChild(floating);

        requestAnimationFrame(() => {
          if (floating.parentNode) {
            floating.style.transform = "translate3d(0px, -3px, 0) scale(1.045) rotate(-1.1deg)";
          }
        });

        card.classList.add("drag-placeholder");

        dragState = {
          pointerId: e.pointerId,
          card,
          floating,
          container,
          startX: e.clientX,
          startY: e.clientY,
          initialRect: rect,
          changed: false,
          settling: false
        };
      });

      container.addEventListener("pointermove", (e) => {
        if (!dragState || e.pointerId !== dragState.pointerId || dragState.settling) return;
        e.preventDefault();

        const { card, floating, initialRect, startX, startY } = dragState;
        const dx = (e.clientX - startX) * 0.18;
        const dy = e.clientY - startY;

        floating.style.transition = "box-shadow 130ms ease";
        floating.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(1.045) rotate(-1.1deg)`;

        const floatingCenterY = initialRect.top + dy + initialRect.height / 2;
        const siblings = [...container.querySelectorAll(".todo-card:not(.drag-placeholder)")];

        let nextSibling = null;
        for (const sib of siblings) {
          const rect = sib.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          if (floatingCenterY < midY) {
            nextSibling = sib;
            break;
          }
        }

        const currentNext = card.nextElementSibling;
        if (nextSibling !== currentNext) {
          // Record positions before DOM move for smooth FLIP slide animation
          const prevTops = new Map();
          siblings.forEach(sib => prevTops.set(sib, sib.getBoundingClientRect().top));

          container.insertBefore(card, nextSibling);
          dragState.changed = true;

          if (navigator.vibrate) {
            try { navigator.vibrate(6); } catch (_) {}
          }

          siblings.forEach(sib => {
            const oldTop = prevTops.get(sib);
            const newTop = sib.getBoundingClientRect().top;
            const deltaY = oldTop - newTop;
            if (Math.abs(deltaY) > 1 && sib.animate) {
              sib.animate(
                [
                  { transform: `translateY(${deltaY}px)` },
                  { transform: "translateY(0px)" }
                ],
                { duration: 190, easing: "cubic-bezier(0.2, 0.85, 0.25, 1)" }
              );
            }
          });
        }
      });

      const finishDrag = async (e) => {
        if (!dragState || (e && e.pointerId !== dragState.pointerId) || dragState.settling) return;
        dragState.settling = true;

        const { card, floating, initialRect, changed } = dragState;
        const targetRect = card.getBoundingClientRect();
        const targetDx = targetRect.left - initialRect.left;
        const targetDy = targetRect.top - initialRect.top;

        floating.style.transition = "transform 165ms cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 165ms ease";
        floating.style.transform = `translate3d(${targetDx}px, ${targetDy}px, 0) scale(1) rotate(0deg)`;
        floating.style.boxShadow = "0 3px 10px rgba(15, 23, 42, 0.08)";

        await new Promise(r => setTimeout(r, 165));

        if (floating.parentNode) {
          floating.parentNode.removeChild(floating);
        }
        card.classList.remove("drag-placeholder");
        dragState = null;

        if (changed) {
          await commitDomOrder();
        }
      };

      container.addEventListener("pointerup", finishDrag);
      container.addEventListener("pointercancel", finishDrag);
    }

    async function commitDomOrder() {
      const container = document.getElementById("appListContainer");
      const orderedIds = [...container.querySelectorAll(".todo-card")]
        .map(el => el.getAttribute("data-id"))
        .filter(Boolean);
      if (!orderedIds.length) return;

      // Update created_at sequentially so both local and Supabase preserve the exact dragged order
      const baseTime = new Date("2026-01-01T00:00:00Z").getTime();
      const idToRank = new Map();
      orderedIds.forEach((id, idx) => idToRank.set(id, idx));

      const reorderedSubset = [];
      for (const id of orderedIds) {
        const found = items.find(t => t.id === id);
        if (found) {
          const newCreatedAt = new Date(baseTime + idToRank.get(id) * 1000).toISOString();
          found.created_at = newCreatedAt;
          reorderedSubset.push(found);
        }
      }

      const subsetSet = new Set(orderedIds);
      const others = items.filter(t => !subsetSet.has(t.id));
      items = [...reorderedSubset, ...others];
      saveItems();

      const { url, key } = getCreds();
      if (url && key) {
        await Promise.all(
          reorderedSubset.map(item =>
            fetch(`${url.replace(/\/$/, "")}/rest/v1/todos?id=eq.${encodeURIComponent(item.id)}`, {
              method: "PATCH",
              headers: { apikey: key, Authorization: `Bearer ${key}`, "Content-Type": "application/json" },
              body: JSON.stringify({ created_at: item.created_at })
            }).catch(() => {})
          )
        );
        notifyNativeWidget();
      }
    }

    initDragReorder();
    loadItems();
    setInterval(pollChatUpdates, 3500);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
